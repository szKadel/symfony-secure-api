services:
  api:
    build: .
    ports:
      - "127.0.0.1:8081:8000"
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: "local-dev-only-change-me"
      DATABASE_URL: "postgresql://app:app_dev_password@db:5432/secure_api?serverVersion=16&charset=utf8"
      DEFAULT_URI: "http://localhost:8081"
      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      JWT_PASSPHRASE: "${JWT_PASSPHRASE}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: secure_api
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d secure_api"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
